upstream frappe-server {
    server frappe:8000;
}

upstream socketio-server {
    server frappe:9000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name lms.localhost;

    # Set maximum upload file size to 1GB
    client_max_body_size 1024m;
    client_header_timeout 120;
    client_body_timeout 120;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # Increase buffer sizes for large uploads
    client_body_buffer_size 32M;
    proxy_buffering off;
    proxy_request_buffering off;

    # Enable gzip compression
    gzip on;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Handle file uploads 
    location /api/method/upload_file {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Special handling for large file uploads
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    location / {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://socketio-server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle static files efficiently
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|mp4|webm|ogg|mov|avi|mkv|mp3|wav|ogg|m4a|flac)$ {
        proxy_pass http://frappe-server;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Allow large media files
        client_max_body_size 1024m;
    }
}